version: '3.9'

# ============================================================
# ClauseGuard — Local Development Docker Compose
#
# Usage:
#   1. Copy backend/.env.example to backend/.env and fill in values.
#   2. docker-compose up --build
#
# Services:
#   db        PostgreSQL 15          → localhost:5432
#   chroma    ChromaDB               → localhost:8001 (mapped from 8000)
#   backend   FastAPI / Uvicorn      → localhost:8000
#   frontend  React (nginx)          → localhost:3000
# ============================================================

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: clauseguard
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clauseguard_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to use the Docker service hostname
      DATABASE_URL: postgresql://clauseguard:${POSTGRES_PASSWORD:-clauseguard_dev_password}@db:5432/clauseguard
      # Override Chroma to use the Docker service hostname
      CHROMA_PERSIST_DIRECTORY: /chroma_data
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/chroma_data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
  uploads_data:
